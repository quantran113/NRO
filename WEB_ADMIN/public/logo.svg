<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Sphere Gradient -->
    <radialGradient id="ballGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#fff3e0" />
      <stop offset="20%" stop-color="#ffb74d" />
      <stop offset="55%" stop-color="#ff6d00" />
      <stop offset="85%" stop-color="#d50000" />
      <stop offset="100%" stop-color="#800000" />
    </radialGradient>

    <!-- Glass Reflection Gradient -->
    <linearGradient id="glassGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <!-- Star Shading -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff1744" />
      <stop offset="100%" stop-color="#b71c1c" />
    </linearGradient>

    <!-- Star Filter Glow -->
    <filter id="starGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#800000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Outer Ring Shadow -->
  <circle cx="100" cy="104" r="92" fill="rgba(0,0,0,0.15)" />

  <!-- Outer Metallic Golden Border -->
  <circle cx="100" cy="100" r="94" fill="none" stroke="#ffe0b2" stroke-width="3" opacity="0.8" />
  <circle cx="100" cy="100" r="92" fill="none" stroke="#ff6d00" stroke-width="2" />

  <!-- Main Dragon Ball Crystal Sphere -->
  <circle cx="100" cy="100" r="90" fill="url(#ballGrad)" />

  <!-- Inner Ambient Glow -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="#ffab40" stroke-width="2" opacity="0.6" />

  <!-- 4 STARS (Ngọc Rồng 4 Sao Classic) -->
  <g filter="url(#starGlow)">
    <!-- Top Star -->
    <polygon points="100,50 104,63 118,63 107,72 111,85 100,76 89,85 93,72 82,63 96,63" fill="url(#starGrad)" />
    <!-- Bottom Star -->
    <polygon points="100,118 104,131 118,131 107,140 111,153 100,144 89,153 93,140 82,131 96,131" fill="url(#starGrad)" />
    <!-- Left Star -->
    <polygon points="66,84 70,97 84,97 73,106 77,119 66,110 55,119 59,106 48,97 62,97" fill="url(#starGrad)" />
    <!-- Right Star -->
    <polygon points="134,84 138,97 152,97 141,106 145,119 134,110 123,119 127,106 116,97 130,97" fill="url(#starGrad)" />
  </g>

  <!-- 3D Glass Surface Gloss Highlight -->
  <path d="M 30,75 A 75,75 0 0,1 170,75 A 82,82 0 0,0 30,75 Z" fill="url(#glassGloss)" />
  
  <!-- Bottom Subtle Light Rim Reflection -->
  <path d="M 40,150 A 75,75 0 0,0 160,150 A 78,78 0 0,1 40,150 Z" fill="#ffffff" opacity="0.25" />
</svg>
